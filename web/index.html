    "@context": "https://schema.org",

  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; background: #FFBA1C; }
    #seo-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3a0000; background: #FFBA1C;
      transition: opacity .3s ease;
    }
    #seo-splash.hide { opacity: 0; pointer-events: none; }
    .loader { position: relative; width: 132px; height: 132px; }
    .loader img {
      position: absolute; inset: 18px; width: 96px; height: 96px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .loader::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 5px solid rgba(187, 0, 0, .18); border-top-color: #BB0000;
      animation: spin .9s linear infinite;
    }
    #seo-splash h1 { font-size: 18px; margin: 20px 0 0; color: #BB0000; font-weight: 700; }
    #seo-splash p { max-width: 420px; margin: 6px 0 0; font-size: 13px; line-height: 1.4; opacity: .75; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @media (prefers-reduced-motion: reduce) {
      .loader img, .loader::before { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <!-- Contenuto HTML reale per crawler e anteprime (Flutter disegna su canvas).
       Viene rimosso quando l'app Flutter mostra il primo frame. -->
  <main id="seo-splash" aria-busy="true">
    <div class="loader" role="progressbar" aria-label="Caricamento">
      <img src="icons/Icon-192.png" alt="Kebabbo">
    </div>
    <h1>Kebabbo – I migliori kebab di Bologna</h1>
    <p>Classifiche, recensioni della community e mappa dei kebabbari.</p>
  </main>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('seo-splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
