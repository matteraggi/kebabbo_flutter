<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Feature graphic C – Spiedo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: "Figtree", sans-serif;
    background: radial-gradient(circle at 30% 50%, #D41414 0%, #BB0000 45%, #8E0000 100%); color: #fff; }
  .wrap { position: relative; width: 1024px; height: 500px; }
  .glow { position: absolute; left: 70px; top: 40px; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,186,28,.45), rgba(255,186,28,0) 65%); }
  .copy { position: absolute; left: 500px; top: 44px; width: 470px; }
  .logo { height: 150px; display: block; margin-bottom: 18px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.25)); }
  h1 { font: 800 54px/0.98 "Bricolage Grotesque", sans-serif; letter-spacing: -0.03em; color: #FFBA1C; }
  p { margin-top: 14px; font-size: 22px; font-weight: 600; line-height: 1.3; color: #fff; }

  /* Lo spiedo del caricamento, ingrandito (frame fisso). */
  .spit { position: absolute; left: 140px; top: 52px; width: 120px; height: 170px; transform: scale(2.35); transform-origin: 0 0; }
  .spit .rod { position: absolute; left: 37px; top: 0; width: 6px; height: 164px; border-radius: 3px; background: linear-gradient(90deg, #8f8f8f, #e7e7e7, #8f8f8f); }
  .spit .cap { position: absolute; left: 30px; top: -2px; width: 20px; height: 9px; border-radius: 4px; background: #9a9a9a; }
  .spit .base { position: absolute; left: 10px; bottom: 0; width: 60px; height: 8px; border-radius: 4px; background: #7d7d7d; }
  .spit .cone { position: absolute; left: 8px; top: 14px; width: 64px; height: 127px;
    clip-path: polygon(3% 0, 97% 0, 100% 7%, 78% 100%, 22% 100%, 0 7%);
    background:
      radial-gradient(ellipse 60% 120% at 50% 40%, rgba(255,214,150,.25), transparent 60%),
      linear-gradient(90deg, rgba(40,10,0,.55), transparent 28%, transparent 72%, rgba(40,10,0,.6)),
      repeating-linear-gradient(176deg, transparent 0 10px, rgba(60,15,0,.35) 10px 12px),
      repeating-linear-gradient(90deg, #B95E24 0 11px, #A2481A 11px 18px, #CF7A36 18px 23px, #6E2A0C 23px 26px); }
  .spit .saber { position: absolute; left: 0; top: 0; transform: translate(80px, 64px) rotate(22deg); }
  .spit .saber .blade { position: absolute; left: -76px; top: -12px; width: 76px; height: 17px;
    clip-path: polygon(100% 50%, 55% 38%, 0 0, 48% 78%, 100% 96%); background: linear-gradient(180deg, #f7f7f7, #c3c8ce 60%, #8d949b); }
  .spit .saber .guard { position: absolute; left: 0; top: -8px; width: 5px; height: 16px; border-radius: 2px; background: #D4A017; }
  .spit .saber .grip { position: absolute; left: 5px; top: -4px; width: 20px; height: 8px; border-radius: 4px; background: #3A2416; }
  .spit .saber .grip::after { content: ""; position: absolute; right: -5px; top: -1px; width: 9px; height: 9px; border-radius: 50%; background: #D4A017; }
  .spit .slice { position: absolute; width: 11px; height: 5px; border-radius: 50%; background: #E08A45; }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="spit">
    <span class="rod"></span><span class="cap"></span>
    <span class="saber"><span class="blade"></span><span class="guard"></span><span class="grip"></span></span>
    <span class="cone"></span>
    <span class="slice" style="left:80px;top:84px;transform:rotate(30deg)"></span>
    <span class="slice" style="left:86px;top:104px;transform:rotate(-40deg)"></span>
    <span class="slice" style="left:78px;top:126px;transform:rotate(70deg);width:9px"></span>
    <span class="slice" style="left:90px;top:146px;transform:rotate(10deg)"></span>
    <span class="base"></span>
  </div>
  <div class="copy">
    <img class="logo" src="logo-arco.png" alt="Kebabbo">
    <h1>Il kebab giusto,<br>ogni volta</h1>
    <p>Classifiche, recensioni e mappa dei migliori kebab di Bologna.</p>
  </div>
</div>
</body>
</html>
