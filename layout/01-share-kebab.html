<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kebabbo – Condividi un kebab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #BB0000;
    --red-deep: #8E0000;
    --saffron: #FFBA1C;
    --char: #2B1A12;
    --muted: #7A6A60;
    --line: #EDE6DF;
    --card: #FFFFFF;
    --board: #FFF3D6;
    --staff: #1D9BF0;
    --community: #7B3FA0;
    --open: #1E8E3E;
    --wa-bg: #E9DFD5;
    --wa-out: #D9FDD3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--board); color: var(--char);
    font-family: "Figtree", system-ui, sans-serif; font-size: 15px; line-height: 1.45;
  }
  header.board-head { max-width: 1240px; margin: 0 auto; padding: 40px 24px 8px; }
  header.board-head h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px;
    letter-spacing: -0.02em; margin: 0 0 6px;
  }
  header.board-head p { margin: 0; max-width: 64ch; color: var(--muted); }
  .board {
    max-width: 1240px; margin: 0 auto; padding: 24px; display: flex; gap: 36px;
    flex-wrap: wrap; justify-content: center; align-items: flex-start;
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  figcaption { max-width: 340px; font-size: 14px; color: var(--muted); text-align: center; }
  figcaption strong { color: var(--char); }

  /* ---------- phone ---------- */
  .phone {
    width: 360px; height: 760px; border-radius: 42px; background: #fff; overflow: hidden;
    position: relative; box-shadow: 0 0 0 10px #1c120d, 0 24px 60px rgba(60, 30, 0, .25);
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 34px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 26px; font-size: 13px; font-weight: 600; position: absolute; inset: 0 0 auto; z-index: 5; color: #fff;
  }

  /* ---------- kebab detail ---------- */
  .hero { height: 250px; position: relative; flex: none; }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,.05) 40%, rgba(0,0,0,.8));
  }
  .appbar {
    position: absolute; top: 38px; left: 0; right: 0; z-index: 3; display: flex;
    justify-content: space-between; padding: 0 10px;
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; background: rgba(0,0,0,.18); border: 0; cursor: pointer;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .appbar .right { display: flex; gap: 4px; }
  .hero h2 {
    position: absolute; left: 18px; right: 18px; bottom: 14px; z-index: 3; margin: 0; color: #fff;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em;
  }
  .info { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
  }
  .chip.open { background: #E6F4EA; color: #137333; border: 1px solid #34A853; }
  .chip.open::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #34A853; }
  .chip.gf { background: #FEF7E0; color: #B06000; border: 1px solid #F9AB00; }
  .chip.comm { background: #E8F1FB; color: #1959A8; }

  /* the one bold element: the rating badge */
  .score {
    width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: var(--saffron);
    display: grid; place-items: center; font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800; font-size: 17px; letter-spacing: -0.03em; flex: none;
    box-shadow: inset 0 0 0 3px rgba(255,186,28,.35);
  }
  .score.sm { width: 34px; height: 34px; font-size: 13px; }
  .score-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .score-row .label { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .score-row .label b { color: var(--char); font-weight: 700; }

  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-top: 14px; }
  .action {
    border-radius: 12px; padding: 9px 4px; display: flex; flex-direction: column; align-items: center;
    gap: 3px; font-size: 12px; font-weight: 700; border: 1px solid; background: none; cursor: pointer;
    font-family: inherit;
  }
  .action svg { width: 19px; height: 19px; }
  .a-map { color: #1A73E8; border-color: rgba(26,115,232,.25); background: rgba(26,115,232,.07); }
  .a-rev { color: var(--red); border-color: rgba(187,0,0,.25); background: rgba(187,0,0,.06); }
  .a-pho { color: #E37400; border-color: rgba(227,116,0,.25); background: rgba(227,116,0,.07); }
  .a-share { color: #fff; background: var(--red); border-color: var(--red); }
  .a-share:focus-visible, .icon-btn:focus-visible, .share-target:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs span {
    flex: 1; text-align: center; padding: 11px 0; font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .tabs span.on { color: var(--red); box-shadow: inset 0 -3px 0 var(--red); }
  .body { padding: 14px 16px; background: #FAF7F4; flex: 1; }
  .quote {
    background: #fff; border-radius: 16px; padding: 14px; font-size: 14px; color: #5b4a40;
    font-style: italic;
  }
  .quote b { font-style: normal; display: block; color: var(--char); margin-bottom: 4px; }

  /* ---------- share sheet ---------- */
  .dim { position: absolute; inset: 0; background: rgba(20,10,5,.5); z-index: 6; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; background: #fff;
    border-radius: 26px 26px 0 0; padding: 10px 18px 26px;
  }
  .grab { width: 42px; height: 4px; border-radius: 2px; background: #ddd; margin: 0 auto 14px; }
  .sheet h3 {
    margin: 0 0 12px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 20px;
  }
  .preview {
    display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 18px;
    padding: 10px; margin-bottom: 16px;
  }
  .preview img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
  .preview .t { flex: 1; min-width: 0; }
  .preview .t b { display: block; font-size: 15px; }
  .preview .t span { font-size: 12.5px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .targets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .share-target {
    display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    background: none; border: 0; cursor: pointer; font-family: inherit; color: var(--char); border-radius: 12px; padding: 4px 0;
  }
  .share-target i {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
  }
  .share-target svg { width: 26px; height: 26px; }
  .t-wa i { background: #25D366; color: #fff; }
  .t-ig i { background: radial-gradient(circle at 30% 110%, #FDD54F, #F26E3A 45%, #C13584 70%, #5B51D8); color: #fff; }
  .t-tg i { background: #29A9EB; color: #fff; }
  .t-copy i { background: #F1ECE7; color: var(--char); }
  .linkrow {
    display: flex; align-items: center; gap: 8px; background: #F7F3EF; border-radius: 12px; padding: 10px 12px;
    font-size: 13px;
  }
  .linkrow code { flex: 1; font-family: inherit; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linkrow button {
    border: 0; background: var(--char); color: #fff; font: 700 13px "Figtree", sans-serif; padding: 7px 12px;
    border-radius: 9px; cursor: pointer;
  }
  .toast {
    position: absolute; left: 50%; bottom: 300px; transform: translateX(-50%) translateY(10px); z-index: 9;
    background: var(--char); color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- whatsapp ---------- */
  .wa-top {
    background: #075E54; color: #fff; padding: 42px 14px 12px; display: flex; align-items: center; gap: 10px; flex: none;
  }
  .wa-top .av { width: 36px; height: 36px; border-radius: 50%; background: #FFBA1C; display: grid; place-items: center; font-weight: 700; color: var(--char); }
  .wa-top b { display: block; font-size: 16px; }
  .wa-top span { font-size: 12px; opacity: .8; }
  .wa-chat { flex: 1; background: var(--wa-bg); padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .bubble {
    max-width: 82%; padding: 6px 8px 4px; border-radius: 10px; font-size: 14px; position: relative;
    box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .bubble.in { background: #fff; align-self: flex-start; border-top-left-radius: 2px; }
  .bubble.out { background: var(--wa-out); align-self: flex-end; border-top-right-radius: 2px; }
  .bubble small { display: block; text-align: right; font-size: 11px; color: #667781; }
  .og { background: rgba(0,0,0,.05); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
  .og-img { position: relative; height: 150px; }
  .og-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
  .og-img .score { position: absolute; right: 10px; bottom: 10px; width: 54px; height: 54px; font-size: 19px; border: 3px solid #fff; }
  .og-img .brand {
    position: absolute; left: 10px; top: 10px; background: var(--saffron); color: var(--red);
    font: 800 13px "Bricolage Grotesque", sans-serif; padding: 3px 9px; border-radius: 999px;
  }
  .og-txt { padding: 7px 9px 8px; }
  .og-txt b { display: block; font-size: 14px; }
  .og-txt span { display: block; font-size: 12.5px; color: #54656F; }
  .og-txt em { display: block; font-style: normal; font-size: 12px; color: #8696A0; margin-top: 2px; }
  .bubble a { color: #027EB5; word-break: break-all; }

  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="board-head">
  <h1>Condividi un kebab</h1>
  <p>A share button on every kebab page, the sheet it opens, and what your friend receives. The link points to a real HTML page for that kebab, so WhatsApp, Telegram and Google all show the photo, name and rating.</p>
</header>

<main class="board">
  <!-- 1. Kebab page with the share button -->
  <figure>
    <div class="phone" aria-label="Pagina kebab">
      <div class="statusbar"><span>12:41</span><span>5G ▮▮▮</span></div>
      <div class="hero">
        <img src="../assets/kebab-card/bella-istanbul-3.webp" alt="Bella Istanbul 3">
        <div class="appbar">
          <button class="icon-btn" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="right">
            <button class="icon-btn" aria-label="Condividi" data-open-share><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg></button>
            <button class="icon-btn" aria-label="Salva nei preferiti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
          </div>
        </div>
        <h2>Bella Istanbul 3</h2>
      </div>
      <div class="info">
        <div class="chips">
          <span class="chip open">Aperto</span>
          <span class="chip gf">Senza glutine</span>
          <span class="chip comm">Community 4,2 (18)</span>
        </div>
        <div class="score-row">
          <div class="score">4,6</div>
          <div class="label"><b>Voto dello staff Kebabbo</b><br>2,1 km da te</div>
        </div>
        <div class="actions">
          <button class="action a-map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.7-6-11a6 6 0 0 1 12 0c0 5.3-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Mappa</button>
          <button class="action a-rev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Recensisci</button>
          <button class="action a-pho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l2-2h4l2 2"/></svg>Foto</button>
          <button class="action a-share" data-open-share><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg>Condividi</button>
        </div>
      </div>
      <div class="tabs"><span class="on">Panoramica</span><span>Foto (12)</span><span>Recensioni (18)</span></div>
      <div class="body">
        <div class="quote"><b>La recensione di Kebabbo</b>Piadina croccante, carne tagliata al momento, salsa yogurt fatta in casa. Il kebab da battere in zona universitaria.</div>
      </div>
    </div>
    <figcaption><strong>Kebab page.</strong> "Condividi" joins Mappa, Recensisci and Foto, and a share icon also sits in the top bar. Tap either to open the sheet.</figcaption>
  </figure>

  <!-- 2. Share sheet -->
  <figure>
    <div class="phone" aria-label="Foglio di condivisione">
      <div class="statusbar"><span>12:41</span><span>5G ▮▮▮</span></div>
      <div class="hero"><img src="../assets/kebab-card/bella-istanbul-3.webp" alt=""></div>
      <div class="info" style="height:200px"></div>
      <div class="dim"></div>
      <div class="sheet" role="dialog" aria-label="Condividi Bella Istanbul 3">
        <div class="grab"></div>
        <h3>Condividi questo kebab</h3>
        <div class="preview">
          <img src="../assets/kebab-card/bella-istanbul-3.webp" alt="">
          <div class="t"><b>Bella Istanbul 3</b><span>Bologna, zona universitaria</span><span>Staff 4,6, community 4,2</span></div>
          <div class="score sm">4,6</div>
        </div>
        <div class="targets">
          <button class="share-target t-wa"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.6.3.1.2.1.7-.1 1.2z"/></svg></i>WhatsApp</button>
          <button class="share-target t-ig"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></i>Storia</button>
          <button class="share-target t-tg"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.6L2.9 10.8c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.4zM8.8 13.4l9.4-5.9c.5-.3.9-.1.5.2l-8 7.3-.3 3.4-1.6-5z"/></svg></i>Telegram</button>
          <button class="share-target t-copy" data-copy><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></i>Copia link</button>
        </div>
        <div class="linkrow"><code>kebabbo.top/kebab/bella-istanbul-3</code><button data-copy>Copia</button></div>
      </div>
      <div class="toast" role="status">Link copiato</div>
    </div>
    <figcaption><strong>Share sheet.</strong> Preview of what will be sent, the apps people actually use, and the short link. "Storia" shares a ready-made 9:16 image with the rating badge.</figcaption>
  </figure>

  <!-- 3. What the friend sees -->
  <figure>
    <div class="phone" aria-label="Anteprima su WhatsApp">
      <div class="wa-top"><div class="av">G</div><div><b>Giulia</b><span>online</span></div></div>
      <div class="wa-chat">
        <div class="bubble in">stasera kebab? dove andiamo<small>12:39</small></div>
        <div class="bubble out">
          <div class="og">
            <div class="og-img">
              <img src="../assets/kebab-card/bella-istanbul-3.webp" alt="">
              <span class="brand">Kebabbo</span>
              <div class="score">4,6</div>
            </div>
            <div class="og-txt">
              <b>Bella Istanbul 3 – 4,6 su Kebabbo</b>
              <span>Aperto ora, senza glutine, 18 recensioni della community</span>
              <em>kebabbo.top</em>
            </div>
          </div>
          questo, fidati<br><a href="#">https://kebabbo.top/kebab/bella-istanbul-3</a>
          <small>12:41 ✓✓</small>
        </div>
        <div class="bubble in">ok ci sto 🌯<small>12:42</small></div>
      </div>
    </div>
    <figcaption><strong>Link preview.</strong> Comes from the kebab's own HTML page (feature #1). Opening it shows the page on the web, or the kebab inside the app if it's installed.</figcaption>
  </figure>
</main>

<script>
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var toast = b.closest('.phone').querySelector('.toast');
      if (!toast) return;
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 1400);
    });
  });
</script>
</body>
</html>
